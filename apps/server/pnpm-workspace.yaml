# Makes this package its own pnpm workspace root, so it installs without being
# listed in the repository root's pnpm-workspace.yaml (D-09 keeps it de-listed
# until the Phase 4 merge).
#
# pnpm 12 reads build-script approval from here; the repo root's
# `pnpm.onlyBuiltDependencies` in package.json is no longer honoured, which is
# what produced ERR_PNPM_IGNORED_BUILDS. Prisma needs its postinstall to fetch a
# query engine, or db:generate has nothing to run.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
