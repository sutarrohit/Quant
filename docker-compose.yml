# Single root Postgres for local development (D-10), replacing the two per-app template compose
# files (apps/server/docker-compose.yml and packages/fastapi-server/docker-compose.yml, neither
# of which shipped a Postgres service of its own). Prisma (prisma/) is the sole schema owner
# (D-11); Python writes into these tables via SQLAlchemy Core (engine/persistence/).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
